server:
  max-http-request-header-size: 50KB
  servlet:
    context-path: /api/v1

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloud_vault}
    username: ${DB_USERNAME:vault_user}
    password: ${DB_PASSWORD:vault_password}
    driver-class-name: org.postgresql.Driver
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:vault_rabbit_user}
    password: ${RABBITMQ_PASSWORD:vault_rabbit_password}

# Custom MinIO properties
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:vault_minio_user}
  secret-key: ${MINIO_SECRET_KEY:vault_minio_password}
  bucket: ${MINIO_BUCKET:cloud-vault}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:very-long-and-secure-secret-key-that-should-be-changed-in-production}
  refresh-secret: ${JWT_REFRESH_SECRET:another-very-long-and-secure-secret-key-for-refresh-tokens}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  cookie-name: refresh_token
